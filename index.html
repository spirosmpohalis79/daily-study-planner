<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ημερήσιο Πλάνο Μελέτης</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Ημερήσιο Πλάνο Μελέτης</h1>
    <p>Οργάνωσε απλά τις εργασίες και το διάβασμά σου.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="π.χ. Επανάληψη Java" required>
      <button type="submit">Προσθήκη</button>
    </form>
    <ul id="task-list"></ul>
    <p id="counter">Ολοκληρωμένες εργασίες: 0</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
